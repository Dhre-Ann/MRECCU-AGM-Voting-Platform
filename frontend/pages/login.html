<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRECCU AGM Login</title>
  <link href="../dist/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-canvas font-sans text-ink antialiased">

  <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--color-canvas-tint)_0%,_transparent_55%),radial-gradient(ellipse_at_bottom_right,_#eae9ef_0%,_transparent_45%)]"></div>

  <main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-md">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex w-fit items-center justify-center rounded-2xl bg-surface px-5 py-3 shadow-sm ring-1 ring-border">
          <img
            src="../assets/mrccu-logo.png"
            alt="MRECCU logo"
            class="h-auto w-36 sm:w-44"
          />
        </div>
        <p class="text-caption font-medium tracking-wide text-primary-muted uppercase">
          Annual General Meeting
        </p>
        <h1 class="mt-1 text-display font-bold text-primary">Member Login</h1>
        <p class="mt-2 text-ui text-ink-muted">
          Sign in with your registered phone and account number to vote securely.
        </p>
      </div>

      <form id="voterForm" class="space-y-5 rounded-2xl bg-surface p-6 shadow-md ring-1 ring-border sm:p-8" novalidate>
        <div
          id="loginError"
          role="alert"
          class="hidden rounded-lg border border-error/30 bg-error-soft px-4 py-3 text-ui text-error"
        ></div>

        <label class="block">
          <span class="mb-1.5 block text-ui font-semibold text-ink">Phone Number</span>
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            inputmode="numeric"
            autocomplete="tel"
            required
            aria-describedby="phoneHint"
            class="block min-h-12 w-full rounded-lg border border-border bg-surface px-4 py-3 text-body text-ink placeholder:text-ink-muted/60 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/40"
          />
          <span id="phoneHint" class="mt-1.5 block text-caption text-ink-muted">Format: 123-4567</span>
        </label>

        <label class="block">
          <span class="mb-1.5 block text-ui font-semibold text-ink">Account Number</span>
          <input
            type="text"
            id="accountNumber"
            name="accountNumber"
            inputmode="numeric"
            autocomplete="off"
            required
            aria-describedby="accountHint"
            class="block min-h-12 w-full rounded-lg border border-border bg-surface px-4 py-3 text-body text-ink placeholder:text-ink-muted/60 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/40"
          />
          <span id="accountHint" class="mt-1.5 block text-caption text-ink-muted">5-digit member account number</span>
        </label>

        <button
          type="submit"
          id="loginSubmitBtn"
          class="flex min-h-[52px] w-full items-center justify-center rounded-lg bg-accent px-4 py-3 text-body font-semibold text-white transition hover:bg-accent-hover focus:outline-none focus:ring-2 focus:ring-accent/50 focus:ring-offset-2"
        >
          Continue to Voting
        </button>
      </form>

      <p class="mt-6 text-center text-caption text-ink-muted">
        Mon Repos Eastern Co-operative Credit Union · Secure AGM access
      </p>

      <!-- Kept for JS compatibility; unused when #loginError is present -->
      <div id="result" class="hidden"></div>
    </section>
  </main>

  <script src="../dist/bundle.js"></script>
</body>
</html>
